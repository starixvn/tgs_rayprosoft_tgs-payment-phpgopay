include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/payment-phpgo
  TgsSettingKey: payment-phpgopay
  HelmTemplateFolderName: phpgo-pay
  BuildCacheKey: Tgs.PhpGoPay.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package 'PhpGoPay.Client'
  artifacts:
    paths:
      - PhpGoPay.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker 'Tgs.Payment.PhpGoPay/Tgs.Payment.PhpGoPay.csproj' $ImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateFolderName $ImageName $Tag

deploy-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
    - |
      cat << EOF | name_template="tgs-57pay" deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
        {
          "podServiceName": "Payment-FiveSevenPay",
          "podEnv": [
            {
              "name": "ConnectionStrings__Nats",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "nats"
                }
              }
            },
            {
              "name": "PhpGoPay__PaymentApiUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-fivesevenpay-paymentApiUrl-v2"
                }
              }
            },
            {
              "name": "PhpGoPay__CallbackBaseUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-fivesevenpay-callback-v2"
                }
              }
            },
            {
              "name": "PhpGoPay__PaymentCode",
              "value": "FiveSevenPay-V2"
            }
          ]
        }
      EOF
    - |
      cat << EOF | name_template="tgs-winpay" deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
        {
          "podServiceName": "Payment-WinPay",
          "podEnv": [
            {
              "name": "ConnectionStrings__Nats",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "nats"
                }
              }
            },
            {
              "name": "PhpGoPay__PaymentApiUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-winpay-paymentApiUrl"
                }
              }
            },
            {
              "name": "PhpGoPay__CallbackBaseUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-winpay-callback"
                }
              }
            },
            {
              "name": "PhpGoPay__PaymentCode",
              "value": "WinPay"
            }
          ]
        }
      EOF
    - |
      cat << EOF | name_template="tgs-malakipay" deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
        {
          "podServiceName": "Payment-MalakiPay",
          "podEnv": [
            {
              "name": "ConnectionStrings__Nats",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "nats"
                }
              }
            },
            {
              "name": "PhpGoPay__PaymentApiUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-malakipay-paymentApiUrl-v2"
                }
              }
            },
            {
              "name": "PhpGoPay__CallbackBaseUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-malakipay-callback-v2"
                }
              }
            },
            {
              "name": "PhpGoPay__PaymentCode",
              "value": "MalakiPay-V2"
            }
          ]
        }
      EOF
    - |
      cat << EOF | name_template="tgs-123pay" deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
        {
          "podServiceName": "Payment-123Pay",
          "podEnv": [
            {
              "name": "ConnectionStrings__Nats",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "nats"
                }
              }
            },
            {
              "name": "PhpGoPay__PaymentApiUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-123pay-paymentApiUrl"
                }
              }
            },
            {
              "name": "PhpGoPay__CallbackBaseUrl",
              "valueFrom": {
                "secretKeyRef": {
                  "name": "tgs-connections",
                  "key": "payment-123pay-callback"
                }
              }
            },
            {
              "name": "PhpGoPay__PaymentCode",
              "value": "123Pay"
            }
          ]
        }
      EOF
  when: on_success

